name: Deploy course to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble Pages site
        run: |
          mkdir -p _site/course _site/presentations/claude-code-talk-pack
          cp -R site/. _site/
          cp -R course/. _site/course/
          cp course/favicon.svg _site/favicon.svg
          cp presentations/claude-code-talk-pack/claude-code-talk.html _site/presentations/claude-code-talk-pack/
          cp presentations/claude-code-talk-pack/claude-code-presenter-notes-diagram-refined.html _site/presentations/claude-code-talk-pack/
          cp presentations/claude-code-talk-pack/claude-code-talk-runbook.md _site/presentations/claude-code-talk-pack/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
