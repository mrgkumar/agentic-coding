<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shopping Calculator</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="card">
      <div class="heading">
        <span class="icon">🛒</span>
        <div>
          <h1>Shopping Calculator</h1>
          <p>Estimate your final bill after discount and tax.</p>
        </div>
      </div>

      <form id="calculator-form">
        <label>
          Item price
          <div class="input-row">
            <span>₹</span>
            <input id="price" name="price" type="number" min="0" step="0.01" value="1000" required />
          </div>
        </label>

        <label>
          Quantity
          <input id="quantity" name="quantity" type="number" min="1" step="1" value="2" required />
        </label>

        <div class="grid-two">
          <label>
            Discount type
            <select id="discount-type" name="discountType">
              <option value="fixed" selected>Fixed coupon</option>
              <option value="percent">Percentage</option>
            </select>
          </label>

          <label>
            Discount
            <input id="discount-value" name="discountValue" type="number" min="0" step="0.01" value="200" />
          </label>
        </div>

        <label>
          Tax
          <div class="input-row suffix">
            <input id="tax-rate" name="taxRate" type="number" min="0" step="0.01" value="18" />
            <span>%</span>
          </div>
        </label>

        <button type="submit">Calculate</button>
      </form>

      <section class="result" aria-live="polite">
        <div><span>Subtotal</span><strong id="subtotal">₹0.00</strong></div>
        <div><span>Discount</span><strong id="discount">−₹0.00</strong></div>
        <div><span>Tax</span><strong id="tax">+₹0.00</strong></div>
        <div class="total"><span>Total</span><strong id="total">₹0.00</strong></div>
      </section>

      <p id="error" class="error" hidden></p>
    </section>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
